<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4t_jagga — EST. 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Manrope:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;
    background:#0A0A0A;
    color:#F5F2ED;
    font-family:'Manrope', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }
  body::before{
    content:'';
    position:absolute;
    width:800px;height:800px;
    background: radial-gradient(circle, rgba(212,175,55,0.12) 0%, transparent 70%);
    top:-200px;right:-200px;
    pointer-events:none;
  }
  body::after{
    content:'';
    position:absolute;
    width:600px;height:600px;
    background: radial-gradient(circle, rgba(212,175,55,0.07) 0%, transparent 70%);
    bottom:-100px;left:-100px;
    pointer-events:none;
  }
  .container{
    width:92%;
    max-width:1100px;
    border:1px solid rgba(212,175,55,0.15);
    background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
    backdrop-filter: blur(20px);
    padding:60px;
    position:relative;
  }
  .top-bar{
    display:flex;
    justify-content:space-between;
    font-size:10px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:rgba(245,242,237,0.4);
    border-bottom:1px solid rgba(212,175,55,0.12);
    padding-bottom:20px;
    margin-bottom:60px;
  }
  .gold{color:#D4AF37;}
  h1{
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(48px, 8vw, 92px);
    font-weight:300;
    line-height:0.9;
    letter-spacing:-2px;
  }
  h1 span{
    display:block;
    font-style:italic;
    font-weight:300;
    color:#D4AF37;
    margin-left:40px;
  }
  .divider{
    width:100%;
    height:1px;
    background: linear-gradient(90deg, #D4AF37 0%, transparent 100%);
    margin:40px 0;
    opacity:0.5;
  }
  .bottom{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    flex-wrap:wrap;
  }
  .desc{
    max-width:360px;
    font-size:13px;
    line-height:1.8;
    letter-spacing:0.5px;
    color:rgba(245,242,237,0.55);
    font-weight:300;
  }
  .badge{
    border:1px solid #D4AF37;
    padding:14px 28px;
    font-size:10px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#D4AF37;
  }
  .corner{
    position:absolute;
    width:20px;height:20px;
    border-color:#D4AF37;
    border-style:solid;
    opacity:0.6;
  }
  .tl{top:0;left:0;border-width:1px 0 0 1px;}
  .tr{top:0;right:0;border-width:1px 1px 0 0;}
  .bl{bottom:0;left:0;border-width:0 0 1px 1px;}
  .br{bottom:0;right:0;border-width:0 1px 1px 0;}
</style>
</head>
<body>
  <div class="container">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    
    <div class="top-bar">
      <span>DAY 01 / 30 — 2026</span>
      <span class="gold">● LIVE</span>
      <span>punjab, PK</span>
    </div>

    <h1>
      4t_jagga
      <span></span>
    </h1>

    <div class="divider"></div>

    <div class="bottom">
      <p class="desc">
        A 30-day pursuit of digital craftsmanship. Day one marks the foundation — minimalist, intentional, built to last. No templates. No noise. Just pure creation.
      </p>
      <div class="badge">30 Day Web Challenge</div>
    </div>
  </div>
</body>
</html>
