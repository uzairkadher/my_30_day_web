<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@4t_jagga — DAY 02</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Manrope:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0A0A0A;color:#F5F2ED;font-family:'Manrope',sans-serif;display:flex;align-items:center;justify-content:center;padding:30px 16px;}
.card{width:100%;max-width:850px;border:1px solid rgba(212,175,55,0.15);padding:70px 60px;position:relative;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);}
@media(max-width:600px){.card{padding:40px 24px;}}
.eyebrow{font-size:10px;letter-spacing:4px;opacity:0.4;text-transform:uppercase;margin-bottom:40px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(36px,6vw,64px);font-weight:300;line-height:1.1;max-width:600px;}
h1 em{color:#D4AF37;font-style:italic;}
.rules{margin-top:50px;border-top:1px solid rgba(212,175,55,0.12);padding-top:40px;display:grid;gap:28px;}
.rule{display:flex;gap:20px;align-items:flex-start;}
.num{font-size:10px;color:#D4AF37;letter-spacing:2px;margin-top:6px;min-width:28px;opacity:0.9;}
.text{font-size:14px;line-height:1.7;font-weight:200;color:rgba(245,242,237,0.7);}
.text b{color:#F5F2ED;font-weight:400;}
.footer{margin-top:60px;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:3px;opacity:0.3;text-transform:uppercase;}
.sig{font-family:'Cormorant Garamond',serif;font-size:22px;color:#D4AF37;opacity:1;text-transform:none;letter-spacing:0;font-style:italic;}
</style>
</head>
<body>
<div class="card">
<div class="eyebrow"><span>@4t_jagga — DAY 02 / 30</span><span>MANIFESTO</span></div>

<h1>Build in <em>silence.</em> Let success make the noise.</h1>

<div class="rules">
<div class="rule"><div class="num">01</div><div class="text"><b>No Zero Days.</b> Code, design, or learn — but never zero.</div></div>
<div class="rule"><div class="num">02</div><div class="text"><b>Luxury in Details.</b> If it's not 1% better, it's not done.</div></div>
<div class="rule"><div class="num">03</div><div class="text"><b>Document > Flex.</b> Show the journey, not just the result.</div></div>
</div>

<div class="footer">
<span>EST. LAHORE 2026</span>
<span class="sig">@4t_jagga</span>
</div>

</div>
</body>
</html>
